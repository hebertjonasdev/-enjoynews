[project]
name = "enjoynews-video"
version = "0.1.0"
description = "Daily video generator for EnjoyNews (Shorts + TikTok)"
readme = "../README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "EnjoyNews Bot", email = "bot@enjoynews.com.br"}]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Video & audio
    "moviepy>=1.0.3",
    "edge-tts>=6.1.0",
    "ffmpeg-python>=0.2.0",

    # Stock footage
    "pexels-api>=1.0.0",
    "pixabay-api>=0.1.0",

    # Upload
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.117.0",

    # TikTok
    "httpx>=0.27.0",

    # Data
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "orjson>=3.9.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "tqdm>=4.66.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
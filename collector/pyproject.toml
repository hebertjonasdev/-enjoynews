[project]
name = "enjoynews-collector"
version = "0.1.0"
description = "News collector, summarizer, and MDX publisher for EnjoyNews"
readme = "../README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "EnjoyNews Bot", email = "bot@enjoynews.com.br"}]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # HTTP & parsing
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "newsplease>=1.6.10",
    "readability-lxml>=0.8.1",
    "lxml>=5.2.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # LLM clients (priority: Groq > Together > HF > Ollama)
    "groq>=0.7.0",
    "openai>=1.30.0",  # Used for Together AI (OpenAI-compatible)
    "ollama>=0.3.0",
    "huggingface-hub>=0.23.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "tenacity>=8.3.0",
    "orjson>=3.9.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "rich>=13.7.0",

    # Deduplication / embeddings
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH"]
ignore = ["E501", "PTH203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
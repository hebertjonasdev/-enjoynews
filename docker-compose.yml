version: '3.8'

services:
  # Ollama local (opcional - se quiser rodar local em vez de remoto)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: serve
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - local-llm

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    environment:
      # LLM Providers (prioridade: Groq > Together > HF > Ollama)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-70b-versatile}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - TOGETHER_MODEL=${TOGETHER_MODEL:-meta-llama/Meta-Llama-3.1-70B-Instruct-Turbo}
      - HF_API_TOKEN=${HF_API_TOKEN:-}
      - HF_MODEL=${HF_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      # News APIs
      - NEWSAPI_KEY=${NEWSAPI_KEY:-}
      - GNEWS_KEY=${GNEWS_KEY:-}
      - CURRENTS_KEY=${CURRENTS_KEY:-}
      - MEDIASTACK_KEY=${MEDIASTACK_KEY:-}
      - WORLDNEWS_KEY=${WORLDNEWS_KEY:-}
      - GUARDIAN_KEY=${GUARDIAN_KEY:-}
      # Enrichment APIs
      - BRASIL_API_KEY=${BRASIL_API_KEY:-}
      - WORLDBANK_KEY=${WORLDBANK_KEY:-}
      - ALPHAVANTAGE_KEY=${ALPHAVANTAGE_KEY:-}
      - COINGECKO_KEY=${COINGECKO_KEY:-}
      - OPENWEATHER_KEY=${OPENWEATHER_KEY:-}
      - RESTCOUNTRIES_KEY=${RESTCOUNTRIES_KEY:-}
      # Social
      - NITTER_INSTANCES=${NITTER_INSTANCES:-https://nitter.net,https://nitter.1d4.us,https://nitter.kavin.rocks,https://nitter.catsarch.com,https://nitter.privacydev.net}
    volumes:
      - ./collector/src:/app/src:ro
      - ./blog/src/content/posts:/output/posts
      - ./shared:/app/shared:ro
    profiles:
      - collector
    command: python -m src.pipeline --output /output/posts --once

  video:
    build:
      context: ./video
      dockerfile: Dockerfile
    environment:
      - PEXELS_KEY=${PEXELS_KEY:-}
      - PIXABAY_KEY=${PIXABAY_KEY:-}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID:-}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET:-}
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN:-}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
      - TIKTOK_ACCESS_TOKEN=${TIKTOK_ACCESS_TOKEN:-}
    volumes:
      - ./video/src:/app/src:ro
      - ./output/video:/output
      - ./shared:/app/shared:ro
    profiles:
      - video
    command: python -m src.main --date ${DATE:-$(date +%Y-%m-%d)} --output /output/daily.mp4

  blog:
    build:
      context: ./blog
      dockerfile: Dockerfile
    ports:
      - "4321:4321"
    volumes:
      - ./blog:/app
      - /app/node_modules
    command: npm run dev
    profiles:
      - blog

volumes:
  ollama_data: